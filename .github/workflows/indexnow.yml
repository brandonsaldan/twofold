name: indexnow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: github.event_name == 'deployment_status'
        run: echo "SINCE=$(gh api 'repos/${{ github.repository }}/deployments?environment=Production&per_page=2' --jq '.[1].created_at')" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/indexnow.mjs ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
